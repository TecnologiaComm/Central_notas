# Regras de aprovação — avaliadas de cima para baixo; a primeira que casar vale.
# Condições opcionais por regra: empresa, prestador, cc, valor_min, valor_max
regras:
  - nome: Gestor TI
    aprovadores: [rbastos@commcenter.com.br]   # Robson Gonçalves Bastos

# Palavras que, numa RESPOSTA ao e-mail de aprovação, contam como aprovado/reprovado.
# As de reprovação são verificadas primeiro ("não de acordo" não vira aprovação).
palavras_aprovado: [de acordo, aprovado, aprovada, aprovo, ok, pode lançar]
palavras_reprovado: [não de acordo, nao de acordo, reprovado, reprovada, não aprovo, nao aprovo, recusado, negado]
