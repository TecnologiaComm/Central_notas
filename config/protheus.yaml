# Integração com o Protheus (fase 2) — mapeamentos de negócio.
# Os dados de conexão (URL, usuário, senha) ficam no .env (PROTHEUS_*).
#
# VALIDAR COM A CONTROLADORIA / CONSULTORIA TOTVS antes de ligar em produção:
# códigos de grupo de empresa, tamanho da filial, TES, condição de pagamento e natureza.

# Rotina chamada pelo endpoint:
#   MATA103 = Documento de Entrada (NF fica lançada; status vira "NF LANÇADA")
#   MATA140 = Pré-nota (o fiscal ainda classifica; status fica "AGUARDANDO LANÇAMENTO FISCAL")
rotina: MATA103

# Tamanho de F1_DOC (números maiores ficam com os últimos dígitos) e do código de filial.
tamanho_documento: 9
tamanho_filial: 2

# Valores padrão (podem ser sobrescritos por empresa abaixo)
padrao:
  loja: "01"                 # A2_LOJA quando o código do fornecedor não traz loja ("10DS6V/02")
  serie_nf: "1"              # quando a nota não tem série
  serie_ft: "FT"
  especie_nf: NFS            # F1_ESPECIE para NF de serviço
  especie_ft: FAT            # F1_ESPECIE para fatura (tipo FT)
  tes: "001"                 # D1_TES — TES de entrada de serviço
  condicao_pagamento: "001"  # F1_COND
  natureza: ""               # E2_NATUREZ (vazio = a do cadastro do fornecedor)

# Sigla usada no app/planilha -> grupo de empresa do Protheus (o "01" do tenantId "01,02").
empresas:
  VMT:    {grupo: "01"}
  AXT:    {grupo: "02"}
  LUNA:   {grupo: "03"}
  RCT:    {grupo: "04"}
  VENETO: {grupo: "05"}
  # Exemplo de sobrescrita por empresa:
  # AXT: {grupo: "02", tes: "102", condicao_pagamento: "028"}
