    <a href="#/m/atencao" data-rota="atencao"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg>Atenção</a>
    <a href="#/m/conferencia" data-rota="conferencia"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h10M9 12h10M9 19h10"/><path d="M4 5l1 1 2-2M4 12l1 1 2-2M4 19l1 1 2-2"/></svg>Em conferência</a>
    <a href="#/m/acordo" data-rota="acordo"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Aguardando de acordo</a>
    <a href="#/m/protheus" data-rota="protheus"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>Prontas p/ Protheus</a>
    <a href="#/m/reprovadas" data-rota="reprovadas"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>Não de acordo</a>

    <a href="#/m/ignoradas" data-rota="ignoradas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 22 12a14 14 0 0 1-3.2 4M6.6 6.6A14 14 0 0 0 2 12s4 7 10 7a9 9 0 0 0 4-.9"/></svg>Ignoradas</a>
    <div class="secao">GESTÃO</div>
    <a href="#" id="btn-exportar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Baixar planilha</a>

  <div class="eu"><b id="quem"></b><span id="papel"></span></div>
</aside>

<div id="avisos"></div>
<main id="conteudo"></main>

<!-- Login -->
<template id="tpl-login">
  <div class="card login">
    <h1>Central de Notas</h1>
    <p class="sub">Prestação de Contas TI · acesso restrito</p>
    <form id="form-login">
      <label>E-mail<input type="email" name="email" autocomplete="username" required></label>
      <label>Senha<input type="password" name="senha" autocomplete="current-password" required></label>
      <button class="btn pri" style="width:100%">Entrar</button>
      <p class="erro" id="erro-login"></p>
      <p style="text-align:center;margin:14px 0 0"><a href="#" id="lnk-esqueci">Esqueci minha senha</a></p>
    </form>
  </div>
</template>

<!-- Esqueci minha senha -->
<template id="tpl-esqueci">
  <div class="card login">
    <h1>Esqueci minha senha</h1>
    <p class="sub">Digite seu e-mail da Comm. Você vai receber um link da caixa prestacaocontasti@ para criar uma nova senha.</p>
    <form id="form-esqueci">
      <label>E-mail<input type="email" name="email" autocomplete="username" placeholder="nome@commcenter.com.br" required></label>
      <button class="btn pri" style="width:100%">Enviar link</button>
      <p id="msg-esqueci" class="sub" style="margin-top:12px"></p>
      <p style="text-align:center;margin:14px 0 0"><a href="#" id="lnk-voltar">Voltar para o login</a></p>
    </form>
  </div>
</template>

<!-- Troca de senha obrigatória no primeiro acesso -->
<template id="tpl-senha">
  <div class="card login">
    <h1>Crie sua senha</h1>
    <p class="sub" id="txt-senha">No primeiro acesso, troque a senha provisória. Use pelo menos 10 caracteres.</p>
    <form id="form-senha">
      <label>Nova senha<input type="password" name="s1" minlength="10" autocomplete="new-password" required></label>
      <label>Repita a nova senha<input type="password" name="s2" minlength="10" autocomplete="new-password" required></label>
      <button class="btn pri" style="width:100%">Salvar senha</button>
      <p class="erro" id="erro-senha"></p>
    </form>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
